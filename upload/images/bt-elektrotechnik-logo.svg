<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="360" height="120" role="img" aria-label="BT Elektrotechnik Logo">
  <title>BT Elektrotechnik</title>

  <!-- BT Großbuchstaben -->
  <text
    x="8"
    y="88"
    font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
    font-weight="900"
    font-size="90"
    fill="#2d2d2d"
    letter-spacing="-4"
  >BT</text>

  <!-- Elektrotechnik Untertitel in Gold -->
  <text
    x="10"
    y="114"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="22"
    fill="#f5a800"
    letter-spacing="1.5"
  >Elektrotechnik</text>

  <!-- Stecker-Symbol (rechts, vertikal zentriert) -->
  <g transform="translate(248, 5)">
    <!-- Pin links -->
    <rect x="14" y="0" width="13" height="22" rx="3" fill="#2d2d2d"/>
    <!-- Pin rechts -->
    <rect x="36" y="0" width="13" height="22" rx="3" fill="#2d2d2d"/>
    <!-- Stecker-Körper -->
    <rect x="2" y="20" width="60" height="36" rx="8" fill="#2d2d2d"/>
    <!-- Schlitz 1 -->
    <rect x="10" y="29" width="44" height="7" rx="3" fill="#ffffff" opacity="0.22"/>
    <!-- Schlitz 2 -->
    <rect x="10" y="40" width="44" height="7" rx="3" fill="#ffffff" opacity="0.22"/>
    <!-- Kabel nach unten -->
    <rect x="25" y="56" width="14" height="20" rx="4" fill="#2d2d2d"/>
    <!-- Kabel-Bogen nach links -->
    <path d="M 32 76 Q 32 102 12 102" stroke="#2d2d2d" stroke-width="11" fill="none" stroke-linecap="round"/>
    <!-- Kabel-Ende horizontal -->
    <line x1="12" y1="102" x2="0" y2="102" stroke="#2d2d2d" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
